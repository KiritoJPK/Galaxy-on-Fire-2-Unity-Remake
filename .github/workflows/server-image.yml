# The dedicated server image (SERVER.md, "Docker"): every published release pushes ghcr.io/<owner>/gof2-server:<tag> and
# :latest (not for a pre-release). Run it by hand for another tag (that tag only).
# The image is the release's own server build when the release has one: GoF2Remake-LinuxServer-<tag>.zip (GoF2 > Build >
# Linux Dedicated Server (Release Zip), built with the other platforms under the same version), so the image and the
# release are one build; no Unity licence or project checkout is needed then. A release without it builds the server from
# its commit (docker/build-server.sh) and attaches that zip to the release.
# Secrets for the build from source: UNITY_EMAIL and UNITY_PASSWORD, a Unity account without two-factor sign-in (its
# Personal licence is activated for the build and returned afterwards).
# Git LFS for the build from source: only what the server build keeps; the textures (stripped from a server build) and
# Reference/ Modding/ stay pointers, ~420 MB instead of 2.5 GB, and the objects are cached between runs.
name: Server image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
      version:
        description: Shown version for a build from source (yyyy.MM.dd.HHmm, the release's other builds'); empty = the commit's time
        required: false

permissions:
  contents: write   # attach a server zip built from source to the release
  packages: write

concurrency: server-image

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  LFS_EXCLUDE: "*.png,Reference/**,Modding/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: The release's server zip
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name | select(test("LinuxServer.*\\.zip$"))][0] // ""' 2>/dev/null || true)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ -n "$name" ]; then echo "Using the release's $name"; else echo "No server zip in the release: building from source"; fi

      # With the release's zip only docker/ is needed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          lfs: false
          sparse-checkout: ${{ steps.asset.outputs.name != '' && 'docker' || '' }}

      - name: Unpack the release's server
        if: steps.asset.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/server"
          dir=$(dirname "$(find "$RUNNER_TEMP/server" -name GoF2Server.x86_64 | head -1)")
          [ -f "$dir/GoF2Server.x86_64" ] || { echo "$ASSET has no GoF2Server.x86_64"; exit 1; }
          mkdir -p Build && rm -rf Build/LinuxServer && mv "$dir" Build/LinuxServer
          find Build/LinuxServer \( -name '*.x86_64' -o -name '*.so' -o -name '*.sh' \) -exec chmod +x {} +

      - name: Free disk space
        if: steps.asset.outputs.name == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: LFS objects to fetch
        if: steps.asset.outputs.name == ''
        run: git lfs ls-files --long --exclude="$LFS_EXCLUDE" | cut -d' ' -f1 | sort > .lfs-ids

      - uses: actions/cache@v4
        if: steps.asset.outputs.name == ''
        with:
          path: .git/lfs/objects
          key: lfs-server-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-server-

      - name: Git LFS
        if: steps.asset.outputs.name == ''
        run: git lfs pull --exclude="$LFS_EXCLUDE" && rm .lfs-ids

      - name: Build the server
        if: steps.asset.outputs.name == ''
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GOF2_BUILD_VERSION: ${{ inputs.version }}
        run: docker/build-server.sh && rm -rf Build/LinuxServer/*_BackUpThisFolder_ButDontShipItWithYourGame Build/LinuxServer/*_DoNotShip

      - name: Image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gof2-server"
          docker build -t "$image:$TAG" -f docker/server.Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$TAG" Build/LinuxServer
          # It must come up as a server before it is published.
          docker run -d --name smoke "$image:$TAG"
          timeout 180 sh -c 'until docker logs smoke 2>&1 | grep -q "Type \"help\""; do sleep 2; done' || { docker logs smoke 2>&1 | tail -50; exit 1; }
          docker logs smoke 2>&1 | grep -m1 "dedicated server, build"
          docker rm -f smoke
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$TAG"
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$PRERELEASE" != true ]; then
            docker tag "$image:$TAG" "$image:latest" && docker push "$image:latest"
          fi

      # A server built from source joins the release's other files (when the tag has a release).
      - name: Attach the server zip to the release
        if: steps.asset.outputs.name == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || { echo "No release for $TAG"; exit 0; }
          zip="$RUNNER_TEMP/GoF2Remake-LinuxServer-$TAG.zip"
          mkdir -p "$RUNNER_TEMP/zip" && cp -a Build/LinuxServer "$RUNNER_TEMP/zip/GoF2Server"
          (cd "$RUNNER_TEMP/zip" && zip -qry "$zip" GoF2Server)
          gh release upload "$TAG" "$zip" -R "$GITHUB_REPOSITORY" --clobber
